services:
  db:
    image: postgres:16-alpine
    container_name: itcube-db
    environment:
      POSTGRES_USER: itcube
      POSTGRES_PASSWORD: itcube
      POSTGRES_DB: itcube
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itcube -d itcube"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: itcube-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: itcube-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend
    container_name: itcube-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://itcube:itcube@db:5432/itcube
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:4173,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./backend/src:/app/src:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --app-dir src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
        VITE_API_TRANSPORT: ${VITE_API_TRANSPORT:-backend}
    image: org-frontend:latest
    container_name: org-frontend
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
