services:
  db:
    image: postgres:16-alpine
    container_name: itcube-db
    environment:
      POSTGRES_USER: itcube
      POSTGRES_PASSWORD: itcube
      POSTGRES_DB: itcube
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itcube -d itcube"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: itcube-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: itcube-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./Backend
    container_name: itcube-api
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://itcube:itcube@db:5432/itcube
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      REDIS_URL: redis://redis:6379/0
      RUN_SEED: ${RUN_SEED:-true}
      RUN_RELOAD: ${RUN_RELOAD:-true}
    volumes:
      - ./Backend/src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: org-frontend:latest
    container_name: org-frontend
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
