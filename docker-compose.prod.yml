services:
  db:
    image: postgres:16-alpine
    container_name: itcube-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itcube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-itcube}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itcube} -d ${POSTGRES_DB:-itcube}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: itcube-redis
    restart: unless-stopped

  api:
    build:
      context: ./Backend
      cache_from:
        - itcube-api:latest
    image: itcube-api:latest
    container_name: itcube-api
    env_file:
      - ./Backend/.env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-itcube}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-itcube}
      REDIS_URL: redis://redis:6379/0
      RUN_SEED: ${RUN_SEED:-false}
      RUN_RELOAD: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      cache_from:
        - org-frontend:latest
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_HACKATHON_CHAT_URL: ${VITE_HACKATHON_CHAT_URL:-}
        VITE_MENTORS_CHAT_URL: ${VITE_MENTORS_CHAT_URL:-}
    image: org-frontend:latest
    container_name: org-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
