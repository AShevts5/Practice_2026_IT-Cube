openapi: 3.0.0
info:
  title: IT-Cube Platform API
  version: 1.0.0
  description: Backend API (FastAPI) — registration, auth, team cabinet, admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string

    CaptainRegisterRequest:
      type: object
      required: [email, password, full_name, phone]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        full_name:
          type: string
        phone:
          type: string

    CaptainProfile:
      type: object
      required: [id, email, full_name, phone, has_team]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
        has_team:
          type: boolean
        team_id:
          type: integer
          nullable: true

    OtpChallengeResponse:
      type: object
      required: [challenge_id, channel, message]
      properties:
        challenge_id:
          type: integer
        channel:
          type: string
        message:
          type: string

    OtpRequest:
      type: object
      required: [challenge_id]
      properties:
        challenge_id:
          type: integer
        channel:
          type: string
          enum: [email, sms]
          default: email

    OtpVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: integer
        code:
          type: string

    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        token_type:
          type: string

    EventStatus:
      type: string
      enum:
        - draft
        - published
        - registration_open
        - registration_closed
        - finished

    EventFormat:
      type: string
      enum:
        - online
        - offline
        - hybrid

    EventCard:
      type: object
      required:
        - id
        - title
        - slug
        - description
        - keywords
        - brand
        - status
        - registration_open
        - total_seats_available
        - total_seats_limit
        - total_teams_registered
        - location
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        keywords:
          type: string
          description: Ключевые слова через запятую
        brand:
          type: string
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          description: Место проведения
        format:
          $ref: "#/components/schemas/EventFormat"
          nullable: true
        min_age:
          type: integer
          nullable: true
          description: Минимальный возраст участников
        status:
          $ref: "#/components/schemas/EventStatus"
        registration_open:
          type: boolean
        total_seats_available:
          type: integer
        total_seats_limit:
          type: integer
        total_teams_registered:
          type: integer

    TrackPublic:
      type: object
      required:
        - id
        - title
        - slug
        - description
        - keywords
        - team_limit
        - teams_registered
        - seats_available
        - registration_status
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        keywords:
          type: string
        team_limit:
          type: integer
        teams_registered:
          type: integer
        seats_available:
          type: integer
        registration_status:
          type: string

    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventCard"
        - type: object
          required: [tracks]
          properties:
            tracks:
              type: array
              items:
                $ref: "#/components/schemas/TrackPublic"

    RegistrationRequest:
      type: object
      required:
        - track_id
        - team_name
        - invite_code
      properties:
        track_id:
          type: integer
        team_name:
          type: string
        invite_code:
          type: string

    RegistrationResponse:
      type: object
      required: [team_id, login, password, message]
      properties:
        team_id:
          type: integer
        login:
          type: string
        password:
          type: string
        message:
          type: string

    TeamCabinet:
      type: object
      required:
        - id
        - team_name
        - captain_full_name
        - email
        - phone
        - event_title
        - event_slug
        - track_title
        - track_id
        - can_edit
        - can_manage
      properties:
        id:
          type: integer
        team_name:
          type: string
        captain_full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        event_title:
          type: string
        event_slug:
          type: string
        track_title:
          type: string
        track_id:
          type: integer
        can_edit:
          type: boolean
          description: Регистрация открыта — период, когда допускаются изменения
        can_manage:
          type: boolean
          description: Капитан может редактировать данные и менять кейс

    TeamUpdate:
      type: object
      properties:
        team_name:
          type: string
        captain_full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        track_id:
          type: integer

    TrackCreate:
      type: object
      required: [title, slug, team_limit]
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        keywords:
          type: string
          description: Ключевые слова через запятую
        team_limit:
          type: integer

    TrackUpsert:
      type: object
      required: [title, slug, team_limit]
      properties:
        id:
          type: integer
          description: ID существующего кейса; без id — создать новый
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        keywords:
          type: string
          description: Ключевые слова через запятую
        team_limit:
          type: integer

    EventCreate:
      type: object
      required: [title, slug]
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        keywords:
          type: string
        brand:
          type: string
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
        format:
          anyOf:
            - $ref: "#/components/schemas/EventFormat"
            - type: "null"
        min_age:
          type: integer
          nullable: true
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackCreate"

    EventUpdate:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        keywords:
          type: string
        brand:
          type: string
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
        format:
          anyOf:
            - $ref: "#/components/schemas/EventFormat"
            - type: "null"
        min_age:
          type: integer
          nullable: true
        status:
          $ref: "#/components/schemas/EventStatus"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackUpsert"

    EventAdmin:
      type: object
      required: [id, title, slug, description, keywords, brand, status, tracks]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        keywords:
          type: string
        brand:
          type: string
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
        format:
          $ref: "#/components/schemas/EventFormat"
          nullable: true
        min_age:
          type: integer
          nullable: true
        status:
          $ref: "#/components/schemas/EventStatus"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackPublic"

    TeamAdmin:
      type: object
      required:
        - id
        - name
        - captain_full_name
        - email
        - phone
        - track_title
        - created_at
      properties:
        id:
          type: integer
        name:
          type: string
        captain_full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        track_title:
          type: string
        created_at:
          type: string

    TrackStats:
      type: object
      required: [track_id, track_title, limit, occupied, available, status]
      properties:
        track_id:
          type: integer
        track_title:
          type: string
        limit:
          type: integer
        occupied:
          type: integer
        available:
          type: integer
        status:
          type: string

    InviteCode:
      type: object
      required: [id, label, is_used, used_at, created_at]
      properties:
        id:
          type: integer
        code:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        is_used:
          type: boolean
        used_at:
          type: string
          nullable: true
        created_at:
          type: string

    InviteCodeGenerated:
      allOf:
        - $ref: "#/components/schemas/InviteCode"
        - type: object
          required: [code]
          properties:
            code:
              type: string

    InviteGenerate:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 500
        label_prefix:
          type: string
          nullable: true

    InviteCodeCreate:
      type: object
      required: [code]
      properties:
        code:
          type: string
        label:
          type: string
          nullable: true

    Board:
      type: object
      required: [id, name, isFavorite, lastOpenedAt, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        isFavorite:
          type: boolean
        lastOpenedAt:
          type: string
        createdAt:
          type: string

    BoardListResponse:
      type: object
      required: [list, totalPages]
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/Board"
        totalPages:
          type: integer

paths:
  /public/events:
    get:
      operationId: listPublicEvents
      tags: [public]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventCard"

  /public/events/{slug}:
    get:
      operationId: getPublicEvent
      tags: [public]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"

  /registration/events/{event_slug}/teams:
    post:
      operationId: registerTeam
      tags: [registration]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"

  /auth/captain/register:
    post:
      operationId: captainRegister
      tags: [auth-captain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptainRegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /auth/captain/login:
    post:
      operationId: captainLogin
      tags: [auth-captain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"

  /auth/captain/otp/send:
    post:
      operationId: captainOtpSend
      tags: [auth-captain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"

  /auth/captain/otp/verify:
    post:
      operationId: captainOtpVerify
      tags: [auth-captain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /captain/me:
    get:
      operationId: getCaptainProfile
      tags: [captain]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptainProfile"

  /auth/team/login:
    post:
      operationId: teamLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /auth/team/otp/send:
    post:
      operationId: teamOtpSend
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"

  /auth/team/otp/verify:
    post:
      operationId: teamOtpVerify
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /auth/admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"

  /auth/admin/otp/send:
    post:
      operationId: adminOtpSend
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"

  /auth/admin/otp/verify:
    post:
      operationId: adminOtpVerify
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /team/me:
    get:
      operationId: getTeamCabinet
      tags: [team]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCabinet"
    patch:
      operationId: updateTeamCabinet
      tags: [team]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCabinet"

  /admin/events:
    get:
      operationId: listAdminEvents
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventAdmin"
    post:
      operationId: createAdminEvent
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAdmin"

  /admin/events/{event_id}:
    patch:
      operationId: updateAdminEvent
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAdmin"

  /admin/events/{event_id}/finish:
    post:
      operationId: finishAdminEvent
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAdmin"

  /admin/invites/events/{event_id}:
    get:
      operationId: listEventInvites
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteCode"
    post:
      operationId: createEventInvite
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCodeCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeGenerated"

  /admin/invites/events/{event_id}/generate:
    post:
      operationId: generateEventInvites
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteGenerate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteCodeGenerated"

  /admin/teams/events/{event_id}/teams:
    get:
      operationId: listEventTeams
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamAdmin"

  /admin/teams/events/{event_id}/stats:
    get:
      operationId: listEventTrackStats
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackStats"

  /admin/export/events/{event_id}/registrations.csv:
    get:
      operationId: exportEventRegistrations
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string

  /boards:
    get:
      operationId: listBoards
      tags: [boards-mock]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
        - name: favorites
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Mock boards list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardListResponse"
    post:
      operationId: createBoard
      tags: [boards-mock]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Created board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"

  /boards/{boardId}:
    get:
      operationId: getBoard
      tags: [boards-mock]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
    delete:
      operationId: deleteBoard
      tags: [boards-mock]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /boards/{boardId}/favorite:
    put:
      operationId: updateBoardFavorite
      tags: [boards-mock]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isFavorite]
              properties:
                isFavorite:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"

  /boards/{boardId}/rename:
    put:
      operationId: renameBoard
      tags: [boards-mock]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
