<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <title>platformhackathons.ru — офлайн</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f6fa;
        color: #1e293b;
      }
      .card {
        max-width: 360px;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: #64748b;
        line-height: 1.5;
      }
      button {
        margin-top: 20px;
        border: none;
        border-radius: 12px;
        background: #6366f1;
        color: #fff;
        padding: 10px 18px;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Нет подключения</h1>
      <p>Сайт работает офлайн только с ранее загруженными страницами и мероприятиями.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
